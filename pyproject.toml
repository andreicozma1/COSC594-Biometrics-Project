[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cosc594-biometrics-project"
version = "0.1.0"
description = "A simple Market-1501 person retrieval baseline"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "numpy>=2,<3",
  "pillow>=11,<13",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]

[project.scripts]
reid-baseline = "reid_baseline.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/reid_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Cython evaluation.*:UserWarning"]
